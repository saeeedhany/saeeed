title: "signal/noise"
tagline: "Tech thoughts, clear signal."
description: "A personal blog on systems, software, and the tech that shapes how we think."
url: ""
baseurl: ""
author:
  name: "Saeed"
  handle: "@Saeeedhany"
  github: "https://github.com/saeeedhany"
  twitter: "https://twitter.com/Saeeedhany"
  linkedin: "https://linkedin.com/in/saeeedhany"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /tech/:year/:month/:day/:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  books:
    output: true
    permalink: /books/:name/
  personal:
    output: true
    permalink: /personal/:year/:month/:day/:title/
  tech:
    output: true
    permalink: /tech/:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "books"
    values:
      layout: "book"
  - scope:
      path: ""
      type: "personal"
    values:
      layout: "post"
      author: "Saeed"
  - scope:
      path: ""
      type: "tech"
    values:
      layout: "post"
      author: "Saeed"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Saeed"

# Exclude from build
exclude:
    - vendor
    - .bundle
    - Gemfile
    - Gemfile.lock
    - README.md
    - node_modules/
